name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y wget unzip

          ANDROID_HOME="$HOME/android-sdk"
          CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$CMDLINE_TOOLS"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          cp -r /tmp/android-tools/cmdline-tools/* "$CMDLINE_TOOLS/"

          echo "Checking sdkmanager..."
          "$CMDLINE_TOOLS/bin/sdkmanager" --version

          echo "Accepting Android SDK licenses..."
          "$CMDLINE_TOOLS/bin/sdkmanager" --licenses < /dev/null || true

          echo "Installing Android SDK packages..."
          "$CMDLINE_TOOLS/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$CMDLINE_TOOLS/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -O /tmp/gradle.zip

          sudo unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Prepare Android project
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Project structure:"
          find . -maxdepth 2 -type f | sort

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version

          gradle --version

          echo "Building APK..."

          gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
