name: Build Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK
    shell: bash
    run: |
      set -e

      sudo apt-get update
      sudo apt-get install -y wget unzip

      ANDROID_HOME="$HOME/android-sdk"
      CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools/latest"

      mkdir -p "$CMDLINE_TOOLS"

      wget -q \
        https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
        -O /tmp/android-tools.zip

      mkdir -p /tmp/android-tools
      unzip -q /tmp/android-tools.zip -d /tmp/android-tools

      cp -r /tmp/android-tools/cmdline-tools/* "$CMDLINE_TOOLS/"

      "$CMDLINE_TOOLS/bin/sdkmanager" --version

      yes | "$CMDLINE_TOOLS/bin/sdkmanager" --licenses || true

      "$CMDLINE_TOOLS/bin/sdkmanager" \
        "platform-tools" \
        "platforms;android-35" \
        "platforms;android-34" \
        "build-tools;35.0.0" \
        "build-tools;34.0.0"

      echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      echo "$CMDLINE_TOOLS/bin" >> "$GITHUB_PATH"
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

  - name: Install Gradle
    shell: bash
    run: |
      set -e

      wget -q \
        https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
        -O /tmp/gradle.zip

      sudo unzip -q /tmp/gradle.zip -d /opt

      echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

  - name: Prepare Android project
    shell: bash
    run: |
      set -e

      echo "sdk.dir=$ANDROID_HOME" > local.properties

      echo "===== PROJECT STRUCTURE ====="
      find . -maxdepth 5 -type f | sort

      echo "===== MAIN ACTIVITY ====="
      find app/src/main -type f -print

      echo "===== MAIN ACTIVITY CONTENT ====="
      cat app/src/main/java/com/example/androidtest/MainActivity.kt

      echo "===== MANIFEST ====="
      cat app/src/main/AndroidManifest.xml

      echo "===== APP GRADLE ====="
      cat app/build.gradle.kts

  - name: Clean project
    shell: bash
    run: |
      set -e
      gradle clean

  - name: Compile Kotlin
    shell: bash
    run: |
      set -e
      gradle :app:compileDebugKotlin --stacktrace

  - name: Build APK
    shell: bash
    run: |
      set -e

      java -version
      gradle --version

      echo "===== BUILDING APK ====="
      gradle :app:assembleDebug --stacktrace

  - name: Inspect APK
    shell: bash
    run: |
      set -e

      APK="app/build/outputs/apk/debug/app-debug.apk"

      echo "===== APK FILE ====="
      ls -lh "$APK"

      echo "===== APK CONTENTS ====="
      unzip -l "$APK" | head -100

      echo "===== SEARCHING FOR MAIN ACTIVITY IN DEX ====="
      unzip -p "$APK" classes.dex | strings | grep -F "com/example/androidtest/MainActivity" || true

      echo "===== BUILD OUTPUT ====="
      find app/build/outputs -type f -print

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Android-Test-APK
      path: app/build/outputs/apk/debug/app-debug.apk
