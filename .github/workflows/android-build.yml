name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rayan-archive-staging-2026-11-10

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y wget unzip

          ANDROID_HOME="$HOME/android-sdk"
          CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$CMDLINE_TOOLS"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          cp -r /tmp/android-tools/cmdline-tools/* "$CMDLINE_TOOLS/"

          "$CMDLINE_TOOLS/bin/sdkmanager" --version

          yes | "$CMDLINE_TOOLS/bin/sdkmanager" --licenses || true

          "$CMDLINE_TOOLS/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$CMDLINE_TOOLS/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -O /tmp/gradle.zip

          sudo unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Prepare Android project
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "===== Project structure ====="
          find . -maxdepth 5 -type f | sort

      - name: Install offline speaker verification runtime and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets
          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            -o app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum -c -
          curl -fL --retry 3 \
            "https://huggingface.co/csukuangfj/speaker-embedding-models/resolve/0743f301363dec56491a490f6d6cbc9d67f9a3bf/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx?download=true" \
            -o app/src/main/assets/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
          echo "357a834f702b80161e5b981182c038e18553c1f2ca752ed6cec2052365d4129b  app/src/main/assets/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx" | sha256sum -c -

      - name: Check Kotlin compilation
        shell: bash
        run: |
          set -e

          echo "===== MainActivity source ====="
          find app/src -name "MainActivity.kt" -print

          echo "===== MainActivity source content ====="
          cat app/src/main/java/com/personalai/app/MainActivity.kt

          echo "===== Kotlin compilation ====="
          gradle :app:compileDebugKotlin --stacktrace

          echo "===== Compiled classes ====="
          find app/build -type f | grep -E "MainActivity|classes" | head -100

      - name: Build APK
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          echo "===== Building APK ====="
          gradle assembleDebug --stacktrace --info

      - name: Inspect APK
        shell: bash
        run: |
          set -e

          echo "===== APK FILE ====="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "===== APK CONTENT ====="
          unzip -l app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "classes[0-9]*\.dex|AndroidManifest.xml" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
