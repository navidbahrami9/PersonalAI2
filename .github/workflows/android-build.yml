name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-sdk-setup-github-actions
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install Gradle
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Prepare Android project
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "===== Project structure ====="
          find . -maxdepth 7 -type f | sort

      - name: Compile both applications
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          gradle :app:compileDebugKotlin :rayan-controller:compileDebugKotlin --stacktrace

      - name: Build both APKs
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug :rayan-controller:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s rayan-controller/build/outputs/apk/debug/rayan-controller-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh rayan-controller/build/outputs/apk/debug/rayan-controller-debug.apk

      - name: Inspect Rayan Controller APK
        shell: bash
        run: |
          set -e
          unzip -l rayan-controller/build/outputs/apk/debug/rayan-controller-debug.apk |
            grep -E 'classes[0-9]*\.dex|AndroidManifest.xml'

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAI2-and-Rayan-Controller-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            rayan-controller/build/outputs/apk/debug/rayan-controller-debug.apk
