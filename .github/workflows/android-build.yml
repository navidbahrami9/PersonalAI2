name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-sdk-setup-github-actions
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -O /tmp/gradle.zip

          sudo unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Prepare Android project
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "===== Project structure ====="
          find . -maxdepth 5 -type f | sort

      - name: Check Kotlin compilation
        shell: bash
        run: |
          set -e

          echo "===== MainActivity source ====="
          find app/src -name "MainActivity.kt" -print

          echo "===== MainActivity source content ====="
          cat app/src/main/java/com/personalai/app/MainActivity.kt

          echo "===== Kotlin compilation ====="
          gradle :app:compileDebugKotlin --stacktrace

          echo "===== Compiled classes ====="
          find app/build -type f | grep -E "MainActivity|classes" | head -100

      - name: Build APK
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          echo "===== Building APK ====="
          gradle assembleDebug --stacktrace --info

      - name: Inspect APK
        shell: bash
        run: |
          set -e

          echo "===== APK FILE ====="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "===== APK CONTENT ====="
          unzip -l app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "classes[0-9]*\\.dex|AndroidManifest.xml" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
